<!doctype html>
<html lang="en" data-title="mock.doctitle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Tests · Rail Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23d9480f%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/cbt.css">

<script src="js/app.js"></script>

<body>
<main class="wrap fade">
  <div class="list-head">
    <h1 data-i18n="mock.h1">Mock tests</h1>
    <div class="switch light" role="group" aria-label="Choose exam" data-i18n-attr="aria-label:home.examsAria">
      <button data-exam="ntpc">NTPC UG</button><button data-exam="gd">Group D</button>
    </div>
  </div>
  <p class="muted" data-i18n="mock.intro">CBT-style tests with a question palette, timer and 1/3 negative marking. Your progress is kept if you refresh mid-test.</p>
  <div id="resume"></div>
  <h2 class="sec" data-i18n="mock.practice">Practice sets and tough mocks</h2>
  <div class="grid cols-2" id="mocks"></div>
  <h2 class="sec" id="papers" data-i18n="mock.papers">Past papers (real questions, RRB answer keys)</h2>
  <div class="grid cols-2" id="paperList"></div>
</main>
</body>
</html>
