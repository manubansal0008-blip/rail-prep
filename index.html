<!doctype html>

<body>
<main class="wrap">

    <h1 id="examName">RRB exam prep</h1>

      <path d="M0 100 H520 M0 80 H520"/>

  <div class="grid cols-2" id="countdowns"></div>

  <h2 class="sec" data-i18n="home.glance">Exam at a glance</h2>

  <h2 class="sec" data-i18n="home.start">Start practising</h2>
  <div class="grid cols-4" id="cards"></div>

</html>
